name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Servono Postgres, Auth, API REST e Mailpit (gli e2e leggono da lì il magic link).
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector

      # URL e chiave pubblica dello stack locale, per build ed e2e: si ricavano dallo stack
      # appena avviato, senza scriverli nel workflow.
      - name: Export Supabase env
        run: |
          eval "$(npx supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Database tests (pgTAP, RLS)
        run: npm run test:db

      # I tipi committati devono corrispondere allo schema delle migrazioni.
      - name: Generated types are up to date
        run: npm run db:types && git diff --exit-code -- src/lib/db/types.ts

      - name: Unit and acceptance tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Con CI=true il webServer di Playwright esegue build + start (build di produzione).
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
