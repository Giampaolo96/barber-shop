name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Servono solo Postgres e Auth: i test pgTAP girano dentro il database.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector

      - name: Database tests (pgTAP, RLS)
        run: npm run test:db

      # I tipi committati devono corrispondere allo schema delle migrazioni.
      - name: Generated types are up to date
        run: npm run db:types && git diff --exit-code -- src/lib/db/types.ts

      - name: Unit and acceptance tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Con CI=true il webServer di Playwright esegue build + start (build di produzione).
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
